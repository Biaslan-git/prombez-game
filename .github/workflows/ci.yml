name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prombez
          POSTGRES_PASSWORD: prombez
          POSTGRES_DB: prombez
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prombez" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://prombez:prombez@localhost:5432/prombez
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Тесты бота (Telegram Serverless)
        run: node --test bot/test/*.test.js
      - run: npm run db:migrate
      - run: npm run import:sample
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
